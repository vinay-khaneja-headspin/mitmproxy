name: CI

on: [push, pull_request]

# HeadSpin fork CI (adapted from mitmproxy5/.github/workflows/main.yml).
# Uses Python 3.12+ and tox/uv instead of pip requirements.txt.

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest] # windows-latest,
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mhils/workflows/setup-uv@8fe88b311a66c441e01edfebe4cd90d8a47fa335
      - uses: mhils/workflows/uv-sync@8fe88b311a66c441e01edfebe4cd90d8a47fa335
        with:
          args: --only-group tox
      # Network-namespace tests (loopback only), same pattern as mitmproxy5.
      - name: Run tests (ubuntu, network namespace)
        if: matrix.os == 'ubuntu-latest'
        run: |
          TOX_BIN="$(command -v tox)"
          sudo unshare --net -- sh -c "ip link set lo up; cd '${GITHUB_WORKSPACE}' && '${TOX_BIN}' -e py"
      - name: Run tests (macos)
        if: matrix.os == 'macos-latest'
        run: tox -e py
      - uses: codecov/codecov-action@v6.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
